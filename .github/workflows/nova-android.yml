name: Build Exult Nova ARM64
on:
  workflow_dispatch:
  push:
    branches: [nova-controller]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: nova-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install host dependencies and Android packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autoconf-archive libtool pkg-config libsdl2-dev libpng-dev libogg-dev libvorbis-dev zlib1g-dev flex bison gettext
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test input math
        run: |
          mkdir -p /tmp/nova-tests
          javac -d /tmp/nova-tests overlay/android/app/src/main/java/info/exult/NovaInputMath.java scripts/NovaInputMathTest.java
          java -cp /tmp/nova-tests info.exult.NovaInputMathTest
      - name: Compile Android APK
        run: bash scripts/build-nova.sh
      - name: Verify Android manifest and debug signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/Exult-Nova-arm64-debug.apk | tee artifacts/apk-info.txt
          grep "sdkVersion:'33'" artifacts/apk-info.txt
          grep "package: name='info.exult.nova'" artifacts/apk-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/Exult-Nova-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Exult-Nova-arm64-test
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nova-build-diagnostics
          path: |
            build-nova/**/config.log
            build-nova/**/CMakeError.log
            build-nova/**/CMakeOutput.log
          if-no-files-found: ignore
